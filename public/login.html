<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecureTMS – Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="index.html">Secure<span>TMS</span></a>
      <nav>
        <a href="index.html">Home</a>
        <a href="register.html">Register</a>
        <a href="login.html">Login</a>
        <a href="dashboard.html">Dashboard</a>
      </nav>
    </header>

    <main class="container auth-shell">
      <section class="card auth-card">
        <p class="eyebrow">Access account</p>
        <h2>Login</h2>
        <p class="card-text">Authenticate using your registered email and a passkey-style sign-in experience.</p>

        <label for="loginEmail">Registered email</label>
        <input id="loginEmail" type="email" placeholder="Enter registered email" />

        <div class="button-group">
          <button class="btn btn-primary" id="loginBtn" type="button" data-passkey>Sign in with Passkey</button>
          <button class="btn btn-secondary" id="recoverBtn" type="button">Recover Account</button>
        </div>

        <p id="loginMsg" class="message"></p>
        <!-- Logout button (visible after successful login) -->
        <button class="btn btn-secondary" id="logoutBtn" type="button" style="display:none;">Logout</button>
        <!-- Simple spinner for async operations -->
        <div id="spinner" style="display:none;">Loading...</div>
      </section>
    </main>
  </div>

    <script src="libs/simplewebauthn-browser.umd.min.js"></script>
    <script src="utils.js"></script>
    <script src="app.js"></script>
    <script>
      // Run feature detection after scripts load
      detectWebAuthnSupport();
    </script>
</body>
</html>
